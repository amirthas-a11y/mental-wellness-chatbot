<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buddy AI | Wellness</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #4A90E2; --bg: #F4F7F6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; height: 100vh; margin: 0; }
        .sidebar { width: 300px; background: white; padding: 20px; box-shadow: 2px 0 5px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        .main-chat { flex: 1; display: flex; flex-direction: column; padding: 20px; }
        .chat-box { flex: 1; background: white; border-radius: 10px; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 15px; border-radius: 10px; max-width: 70%; word-wrap: break-word; }
        .user { background: var(--primary); color: white; align-self: flex-end; }
        .bot { background: #eee; align-self: flex-start; }
        .input-area { margin-top: 10px; display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 5px; border: 1px solid #ddd; }
        button { padding: 10px 20px; background: var(--primary); color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:disabled { background: #ccc; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h3>Buddy AI 🕺🏻</h3>
        <p>A safe space for hostelites.</p>
        <hr>
        <h4>Your Mood Trend</h4>
        <canvas id="moodChart"></canvas>
        <button onclick="clearHistory()" style="margin-top:auto; background:#ff4757;">Clear History</button>
    </div>
    <div class="main-chat">
        <div class="chat-box" id="chat-box">
            <div class="msg bot">Yo! I'm Buddy. How's campus life treating you today?</div>
        </div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Vent here, bro..." onkeypress="if(event.key==='Enter') send()">
            <button id="send-btn" onclick="send()">Send</button>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('moodChart').getContext('2d');
        let moodChart = new Chart(ctx, {
            type: 'line',
            data: { labels: ['Start'], datasets: [{ label: 'Vibe Score', data: [0], borderColor: '#4A90E2', tension: 0.3 }] },
            options: { scales: { y: { min: -1, max: 1 } } }
        });

        async function send() {
            const input = document.getElementById("user-input");
            const btn = document.getElementById("send-btn");
            const val = input.value.trim();
            if(!val) return;

            addMsg(val, 'user');
            input.value = "";
            btn.disabled = true;

            try {
                const res = await fetch("/chat", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({message: val})
                });
                const data = await res.json();
                addMsg(data.response, 'bot');
                
                // Update Mood Chart
                moodChart.data.labels.push('');
                moodChart.data.datasets[0].data.push(data.score);
                moodChart.update();
            } catch (e) {
                addMsg("Arre yaar, server is acting up. Try again?", 'bot');
            } finally {
                btn.disabled = false;
            }
        }

        function addMsg(t, type) {
            const b = document.getElementById("chat-box");
            const d = document.createElement("div");
            d.className = `msg ${type}`;
            d.innerText = t;
            b.appendChild(d);
            b.scrollTop = b.scrollHeight;
        }

        async function clearHistory() {
            if(confirm("Erase all our chats?")) {
                await fetch("/clear_history", {method: "POST"});
                location.reload();
            }
        }
    </script>
</body>
</html>
